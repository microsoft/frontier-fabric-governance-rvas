# Declarative policy rules for Fabric workspace requests.
# Source of truth for naming/structure: docs/governance-rules.md
# Edit this file to evolve governance without changing scripts.

approvedCapacities:
  # logical name -> { capacityId, region, allowedEnvironments, sku }
  # Replace each capacityId with your capacity's ID. In a lab, both entries
  # can point to the same capacity.
  contosononprodf2:
    capacityId: "33333333-3333-3333-3333-333333333333"
    region: northeurope
    allowedEnvironments: [sbx, dev, stg]
    sku: F2
  contosoprodf4:
    capacityId: "66666666-6666-6666-6666-666666666666"
    region: northeurope
    allowedEnvironments: [prd]
    sku: F4

# Team codes for the second segment of a workspace name (warn-level rule).
# Add a team through a PR.
approvedTeams:
  plt: Data platform
  fin: Finance analytics
  sales: Sales analytics
  mkt: Marketing analytics
  hr: People analytics
  ops: Operations
  ai: Data science and AI
  sec: Security and compliance

# Approved Fabric domains. Every manifest must reference one of these.
# Subdomains only need to match sdm-<code>-<name>; the ones below are examples.
# Team codes and domain codes differ on purpose (sales vs sls).
approvedDomains:
  - dom-fin-corp     # e.g. sdm-fin-rev, sdm-fin-cost
  - dom-hr-people    # e.g. sdm-hr-talent, sdm-hr-pay
  - dom-sls-crm      # e.g. sdm-sls-orders, sdm-sls-acct
  - dom-mkt-brand    # e.g. sdm-mkt-camp, sdm-mkt-web
  - dom-ops-supply   # e.g. sdm-ops-inv, sdm-ops-logi
  - dom-svc-care     # e.g. sdm-svc-cases, sdm-svc-csat
  - dom-plt-data     # e.g. sdm-plt-sample, sdm-plt-shared
  - dom-grc-risk     # e.g. sdm-grc-audit, sdm-grc-priv

approvedSensitivityLabels:
  - Public
  - General
  - Confidential
  - "Highly Confidential"

approvedCostCenters:
  - CC-1001
  - CC-2042
  - CC-9999

quotas:
  # Max workspaces per owning group per environment
  perGroupPerEnv:
    sbx: 50
    dev: 25
    stg: 10
    prd: 5

rules:
  - id: naming-convention
    severity: block
    description: "Name must match <environment>-<team>-<workload>, for example dev-plt-sample-hello"
  - id: name-segments-match-fields
    severity: block
    description: "The environment and team segments of `name` must equal the `environment` and `team` fields"
  - id: manifest-filename
    severity: block
    description: "The manifest file must be workspaces/<name>.yaml (checked by scripts/validate.py)"
  - id: capacity-allow-list
    severity: block
    description: "`capacity` must reference an entry in approvedCapacities"
  - id: capacity-allowed-for-env
    severity: block
    description: "Selected capacity must permit this environment"
  - id: region-matches-capacity
    severity: block
    description: "`region` must match the capacity's region"
  - id: team-allow-list
    severity: warn
    description: "`team` should be in approvedTeams (add a new team through a PR)"
  - id: domain-allow-list
    severity: block
    description: "`domain` must be in approvedDomains"
  - id: subdomain-pattern
    severity: block
    description: "`subDomain` must match sdm-<code>-<name>"
  - id: owners-min-two-groups
    severity: block
    description: "At least 2 owners and at least one must be a Group"
  - id: owners-have-admin
    severity: block
    description: "At least one owner must have role=Admin"
  - id: owner-groups-exist
    severity: block
    description: "Each Group owner must exist in Entra (checked only when LIVE_CHECKS=true)"
  - id: owner-group-naming
    severity: warn
    description: "Group owners with `groupName` set should follow grp_<fabric|powerbi>_<env>_<team>_<role>"
  - id: sensitivity-required
    severity: block
    description: "`sensitivityLabel` is required and must be in approvedSensitivityLabels"
  - id: cost-center-allow-list
    severity: block
    description: "`costCenter` must be in approvedCostCenters"
  - id: description-quality
    severity: block
    description: "`description` must be >= 30 chars"
  - id: no-personal-workspaces
    severity: block
    description: "Reject names that contain my, personal, mine or me as a whole word"
  - id: prod-extra-controls
    severity: block
    description: "Workspaces with environment prd must use Confidential or higher sensitivity and >=2 group owners"
