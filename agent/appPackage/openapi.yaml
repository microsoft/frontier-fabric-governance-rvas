openapi: 3.0.3
info:
  title: Fabric Workspace Governance API
  description: >
    Backend for the Fabric Workspace Provisioner M365 declarative agent.
    Reuses the rule engine that gates governance pull requests, so the
    agent's pre-flight validation matches the PR check.
  version: 1.1.0
servers:
  - url: https://<your-function-app>.azurewebsites.net/api
    description: Azure Functions backend. The agent-build workflow replaces the host.
paths:
  /policy:
    get:
      operationId: getPolicy
      summary: Get the list of approved values used to compose a workspace request.
      responses:
        "200":
          description: Approved values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"

  /validate:
    post:
      operationId: validateWorkspace
      summary: Validate a draft workspace manifest. No side effects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceManifest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"

  /submit:
    post:
      operationId: submitWorkspace
      summary: Validate and open a governance pull request for a workspace request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceManifest"
      responses:
        "200":
          description: Pull request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitResult"
        "400":
          description: Validation failed; no PR was created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitResult"

components:
  schemas:
    Owner:
      type: object
      required: [principalType, identifier, role]
      properties:
        principalType:
          type: string
          enum: [Group, ServicePrincipal, User]
        identifier:
          type: string
          description: Microsoft Entra Object ID, or the UPN of a user.
        role:
          type: string
          enum: [Admin, Member, Contributor, Viewer]
        groupName:
          type: string
          description: Display name of a Group owner. Should follow grp_<fabric|powerbi>_<env>_<team>_<role>.

    WorkspaceManifest:
      type: object
      required:
        - name
        - environment
        - team
        - domain
        - subDomain
        - description
        - capacity
        - region
        - sensitivityLabel
        - costCenter
        - owners
      properties:
        name:
          type: string
          description: Lowercase <environment>-<team>-<workload>, for example dev-plt-sample-hello.
          pattern: "^(prd|stg|dev|sbx)-[a-z0-9]{2,6}-[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$"
        environment:
          type: string
          description: sbx sandbox (never promoted), dev Development, stg Test, prd Production. Must equal the first segment of name.
          enum: [sbx, dev, stg, prd]
        team:
          type: string
          description: Team code from approvedTeams in /policy. Must equal the second segment of name.
          pattern: "^[a-z0-9]{2,6}$"
        domain:
          type: string
          description: Must be one of approvedDomains from /policy.
          pattern: "^dom-[a-z]{2,4}-[a-z0-9]{2,6}$"
        subDomain:
          type: string
          description: Pattern sdm-<code>-<name>, for example sdm-fin-rev.
          pattern: "^sdm-[a-z]{2,4}-[a-z0-9]{2,6}$"
        description:
          type: string
          minLength: 30
          maxLength: 4000
        capacity:
          type: string
          description: Must be the name of one of approvedCapacities from /policy.
        region:
          type: string
          description: Must equal the region of the chosen capacity.
          enum: [northeurope, westeurope, eastus, westus, uksouth]
        sensitivityLabel:
          type: string
          enum: [Public, General, Confidential, Highly Confidential]
        costCenter:
          type: string
          description: Must be one of approvedCostCenters from /policy.
          pattern: "^CC-[0-9]{4,6}$"
        owners:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/Owner"
        tags:
          type: array
          description: Optional names of existing Fabric tags, up to 10.
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1

    Finding:
      type: object
      required: [rule_id, severity, message]
      properties:
        rule_id:
          type: string
        severity:
          type: string
          enum: [block, warn, info]
        message:
          type: string

    ValidationResult:
      type: object
      required: [passed, findings, blockingCount, warningCount]
      properties:
        passed:
          type: boolean
        blockingCount:
          type: integer
        warningCount:
          type: integer
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"

    SubmitResult:
      type: object
      required: [passed, submitted]
      properties:
        passed:
          type: boolean
        submitted:
          type: boolean
        pullRequestUrl:
          type: string
        pullRequestNumber:
          type: integer
        branch:
          type: string
        message:
          type: string
        error:
          type: string
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"

    Team:
      type: object
      properties:
        code:
          type: string
        name:
          type: string

    Capacity:
      type: object
      properties:
        name:
          type: string
        region:
          type: string
        allowedEnvironments:
          type: array
          items:
            type: string

    PolicyResponse:
      type: object
      properties:
        approvedTeams:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        approvedDomains:
          type: array
          items: { type: string }
        approvedSensitivityLabels:
          type: array
          items: { type: string }
        approvedCostCenters:
          type: array
          items: { type: string }
        environments:
          type: array
          items: { type: string }
        approvedCapacities:
          type: array
          items:
            $ref: "#/components/schemas/Capacity"
