mcs.metadata:
  componentName: Get Policy
  description: |-
    Calls the "FWG - Get Policy" agent flow, which reads rules/policy.yaml
    from the governance repository through the GitHub REST API and returns
    the file as text. No Function App is involved.
kind: TaskDialog
modelDisplayName: Get Policy
modelDescription: |
  Returns the current governance policy file (rules/policy.yaml) as YAML text.
  It lists the approved teams (approvedTeams), Fabric domains
  (approvedDomains), capacities with their region and allowed environments
  (approvedCapacities), sensitivity labels (approvedSensitivityLabels) and
  cost centers (approvedCostCenters). Use it whenever the user asks what is
  allowed, which team, domain or capacity to pick, or to see the policy.
outputs:
  - propertyName: policyYaml

action:
  kind: InvokeFlowTaskAction
  flowId: <your-get-policy-flow-id>

outputMode: All
