mcs.metadata:
  componentName: Submit Workspace Request
  description: |-
    Calls the "FWG - Submit Workspace Request" agent flow. The flow calls the
    GitHub REST API to:
      1. Create the branch request/<workspaceName>-<timestamp> from main
      2. Commit workspaces/<workspaceName>.yaml with the manifest body
      3. Open a pull request titled "Request workspace <workspaceName>"
    It returns the pull request URL and number. The repository's
    .github/workflows/validate.yml workflow then runs scripts/validate.py on
    the pull request; that workflow is the single source of truth for policy
    enforcement.
kind: TaskDialog
inputs:
  - kind: ManualTaskInput
    propertyName: workspaceName
    description: |-
      The composed Fabric workspace name. Used as the file basename
      (workspaces/<workspaceName>.yaml) and in the pull request title and
      branch name.

  - kind: ManualTaskInput
    propertyName: yamlBody
    description: |-
      The full YAML body of the manifest, already formatted by the calling
      topic. The flow writes it verbatim; it does not parse or transform it.

  - kind: ManualTaskInput
    propertyName: requesterEmail
    description: |-
      Email of the user who started the request, taken from System.User.Email.
      It has a value only when the agent authenticates users with Microsoft.
      The flow adds it to the pull request description for traceability.

modelDisplayName: Submit Workspace Request
modelDescription: |
  Submits a fully composed workspace manifest by opening a pull request on
  the governance repository. Only call after the request topic has finished
  collecting and pre-validating every required field.
outputs:
  - propertyName: pullRequestUrl

  - propertyName: pullRequestNumber

  - propertyName: branch

  - propertyName: submitted

  - propertyName: error

action:
  kind: InvokeFlowTaskAction
  flowId: <your-submit-flow-id>

outputMode: All
