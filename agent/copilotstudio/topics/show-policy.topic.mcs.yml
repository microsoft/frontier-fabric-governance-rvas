mcs.metadata:
  componentName: Show Policy
  description: |-
    Calls the "FWG - Get Policy" agent flow to read rules/policy.yaml from
    the governance repository, caches the text in a conversation-scoped
    variable and shows it. No Function App is involved.

kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Show Policy
    triggerQueries:
      - what teams are approved
      - which capacities can I use
      - what domains are approved
      - which cost centers can I use
      - show me the governance policy
      - what is allowed

  actions:
    - kind: SendActivity
      id: sendMessage_pol001
      activity: Looking up the current governance policy in `rules/policy.yaml`…

    - kind: InvokeFlowAction
      id: getPolicy_pol002
      flowId: <your-get-policy-flow-id>
      output:
        kind: SingleVariableOutputBinding
        variable: init:Topic.Policy

    - kind: SetVariable
      id: cachePolicy_pol003
      variable: Global.PolicyCache
      value: =Topic.Policy.policyYaml

    - kind: SendActivity
      id: sendMessage_pol004
      activity: |-
        Here is the current governance policy (`rules/policy.yaml` on the
        main branch). The allow-lists are approvedTeams, approvedDomains,
        approvedCapacities, approvedSensitivityLabels and
        approvedCostCenters.

        ```yaml
        {Topic.Policy.policyYaml}
        ```

        Want to start a workspace request now?
