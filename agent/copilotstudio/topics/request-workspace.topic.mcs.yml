mcs.metadata:
  componentName: Request Workspace
  description: |-
    Multi-turn slot-fill of the Fabric workspace manifest. After collection,
    it runs quick Power Fx pre-flight checks (regex, enum, length) for
    immediate feedback, composes the YAML body and calls the
    "FWG - Submit Workspace Request" agent flow, which opens the governance
    pull request through the GitHub REST API. The enforcement gate is the
    .github/workflows/validate.yml pull request check; the pre-flight only
    catches obvious typos.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Request Workspace
    triggerQueries:
      - request a new workspace
      - I need a Fabric workspace
      - create a Fabric workspace
      - new fabric workspace
      - workspace request
      - provision a workspace

  actions:
    - kind: SendActivity
      id: sendMessage_req001
      activity: |-
        Let's prepare a new workspace request. I'll collect the required
        fields, run a quick sanity check, and open a governance pull
        request for review. Ask "what is allowed?" at any time to see the
        approved teams, domains, capacities and cost centers.

    # ---------- 1. Slot-fill ----------

    - kind: Question
      id: q_env_req002
      alwaysPrompt: true
      variable: init:Topic.Environment
      prompt: "Which **environment**? One of `sbx` (sandbox), `dev`, `stg` or `prd`."
      entity: StringPrebuiltEntity

    - kind: Question
      id: q_team_req003
      alwaysPrompt: true
      variable: init:Topic.Team
      prompt: |-
        What is the owning **team** code? 2-6 lowercase letters or digits,
        ideally an approved team (e.g. `plt`, `fin`, `sales`).
      entity: StringPrebuiltEntity

    - kind: Question
      id: q_workload_req004
      alwaysPrompt: true
      variable: init:Topic.Workload
      prompt: |-
        Name the **workload**: 3-40 lowercase letters, digits or hyphens,
        starting and ending with a letter or digit (e.g. `sample-hello`,
        `revenue`).
      entity: StringPrebuiltEntity

    - kind: SetVariable
      id: setName_req008
      variable: init:Topic.Name
      value: =Concatenate(Topic.Environment, "-", Topic.Team, "-", Topic.Workload)

    - kind: SendActivity
      id: confirmName_req009
      activity: "Composed workspace name: **{Topic.Name}**"

    - kind: Question
      id: q_domain_req010
      alwaysPrompt: true
      variable: init:Topic.Domain
      prompt: |-
        Which **Fabric domain**? Use an approved domain, pattern
        `dom-<code>-<name>` (e.g. `dom-plt-data`).
      entity: StringPrebuiltEntity

    - kind: Question
      id: q_subdomain_req011
      alwaysPrompt: true
      variable: init:Topic.SubDomain
      prompt: |-
        Which **Fabric subdomain**? Pattern `sdm-<code>-<name>` (e.g.
        `sdm-plt-sample`).
      entity: StringPrebuiltEntity

    - kind: Question
      id: q_capacity_req012
      alwaysPrompt: true
      variable: init:Topic.Capacity
      prompt: |-
        Which **capacity**? Use an approved capacity that allows your
        environment, for example `contosononprodf2` for sbx, dev or stg and
        `contosoprodf4` for prd.
      entity: StringPrebuiltEntity

    - kind: Question
      id: q_region_req013
      alwaysPrompt: true
      variable: init:Topic.Region
      prompt: |-
        Which **Azure region**? It must match the capacity's region
        (`northeurope` for both sample capacities).
      entity: StringPrebuiltEntity

    - kind: Question
      id: q_sensitivity_req014
      alwaysPrompt: true
      variable: init:Topic.SensitivityLabel
      prompt: |-
        Which **sensitivity label**? One of `Public`, `General`,
        `Confidential`, `Highly Confidential`. prd workspaces need
        `Confidential` or `Highly Confidential`.
      entity: StringPrebuiltEntity

    - kind: Question
      id: q_costcenter_req015
      alwaysPrompt: true
      variable: init:Topic.CostCenter
      prompt: What is the **cost center**? Use an approved code such as `CC-1001`.
      entity: StringPrebuiltEntity

    - kind: Question
      id: q_description_req016
      alwaysPrompt: true
      variable: init:Topic.Description
      prompt: |-
        Briefly **describe** the workspace and the data product it will host,
        in 30-4000 characters.
      entity: StringPrebuiltEntity

    - kind: Question
      id: q_owners_req017
      alwaysPrompt: true
      variable: init:Topic.OwnersJson
      prompt: |-
        Provide the **owners** as a JSON array: at least 2 owners, at least
        one Group and at least one Admin. prd workspaces need at least 2
        Group owners. Example:

        ```json
        [
          {"principalType":"Group","identifier":"44444444-4444-4444-4444-444444444444","role":"Admin","groupName":"grp_fabric_dev_plt_admin"},
          {"principalType":"User","identifier":"workspace-owner@contoso.com","role":"Member"}
        ]
        ```

        Paste your JSON now.
      entity: StringPrebuiltEntity

    # ---------- 2. Power Fx pre-flight (UX feedback only) ----------
    #
    # The enforcement gate is .github/workflows/validate.yml on the pull
    # request. These checks only catch obvious typos before it is opened.
    # IsMatch is case-sensitive, unlike the `in` operator.

    - kind: SetVariable
      id: precheck_req018a
      variable: init:Topic.PreflightErrors
      value: |-
        =Trim(Concatenate(
          If(IsMatch(Topic.Environment, "^(sbx|dev|stg|prd)$"), "", "- environment must be sbx, dev, stg or prd" & Char(10)),
          If(IsMatch(Topic.Team, "^[a-z0-9]{2,6}$"), "", "- team must be 2-6 lowercase letters or digits" & Char(10)),
          If(IsMatch(Topic.Workload, "^[a-z0-9][a-z0-9\-]{1,38}[a-z0-9]$"), "", "- workload must be 3-40 lowercase letters, digits or hyphens, starting and ending with a letter or digit" & Char(10)),
          If(IsMatch(Topic.Domain, "^dom-[a-z]{2,4}-[a-z0-9]{2,6}$"), "", "- domain must match dom-<code>-<name>" & Char(10)),
          If(IsMatch(Topic.SubDomain, "^sdm-[a-z]{2,4}-[a-z0-9]{2,6}$"), "", "- subDomain must match sdm-<code>-<name>" & Char(10)),
          If(IsMatch(Topic.Region, "^(northeurope|westeurope|eastus|westus|uksouth)$"), "", "- region is not in the allow-list" & Char(10)),
          If(IsMatch(Topic.SensitivityLabel, "^(Public|General|Confidential|Highly Confidential)$"), "", "- sensitivityLabel is not in the allow-list" & Char(10)),
          If(Topic.Environment = "prd" And Not(IsMatch(Topic.SensitivityLabel, "^(Confidential|Highly Confidential)$")), "- prd workspaces need the Confidential or Highly Confidential label" & Char(10), ""),
          If(IsMatch(Topic.CostCenter, "^CC-\d{4,6}$"), "", "- costCenter must match CC-<4-6 digits>" & Char(10)),
          If(Len(Topic.Description) >= 30 And Len(Topic.Description) <= 4000, "", "- description must be 30-4000 characters" & Char(10)),
          If(StartsWith(Trim(Topic.OwnersJson), "["), "", "- owners must be a JSON array that starts with [" & Char(10))
        ))

    - kind: ConditionGroup
      id: branchPreflight_req018b
      conditions:
        - id: condPrefail_req018c
          condition: =Len(Topic.PreflightErrors) > 0
          actions:
            - kind: SendActivity
              id: sendMessage_req018d
              activity: |-
                I spotted some issues before opening the pull request. Please
                start the request again with corrected values:

                {Topic.PreflightErrors}

                Note: this is a quick local check. The repository's
                `validate.yml` workflow runs the full rules engine on the
                pull request and is the authoritative gate.

            - kind: EndDialog
              id: end_req018e
              clearTopicQueue: true

    # ---------- 3. Compose YAML body ----------
    #
    # The flow takes the manifest as one text input and writes it verbatim
    # to workspaces/<name>.yaml. The owners JSON goes in as a one-line YAML
    # flow sequence (JSON arrays are valid YAML), so no conversion step is
    # needed. team and capacity are quoted so values such as `no` or `01`
    # stay strings.

    - kind: SetVariable
      id: assembleYaml_req018
      variable: init:Topic.YamlBody
      value: |-
        =Concatenate(
          "name: ", Topic.Name, Char(10),
          "environment: ", Topic.Environment, Char(10),
          "team: '", Topic.Team, "'", Char(10),
          "domain: ", Topic.Domain, Char(10),
          "subDomain: ", Topic.SubDomain, Char(10),
          "description: |", Char(10),
          "  ", Substitute(Substitute(Topic.Description, Char(13), ""), Char(10), Char(10) & "  "), Char(10),
          "capacity: '", Substitute(Topic.Capacity, "'", "''"), "'", Char(10),
          "region: ", Topic.Region, Char(10),
          "sensitivityLabel: """, Topic.SensitivityLabel, """", Char(10),
          "costCenter: ", Topic.CostCenter, Char(10),
          "owners: ", Substitute(Substitute(Substitute(Topic.OwnersJson, Char(13), " "), Char(10), " "), Char(9), " "), Char(10)
        )

    # ---------- 4. Submit ----------

    - kind: SendActivity
      id: sendMessage_req019
      activity: Opening the governance pull request…

    - kind: InvokeFlowAction
      id: submit_req020
      flowId: <your-submit-flow-id>
      input:
        binding:
          workspaceName: =Topic.Name
          yamlBody: =Topic.YamlBody
          requesterEmail: =System.User.Email
      output:
        kind: SingleVariableOutputBinding
        variable: init:Topic.SubmitResult

    - kind: ConditionGroup
      id: branchSubmit_req021
      conditions:
        - id: condSubmitOk_req022
          condition: =Topic.SubmitResult.submitted = true
          actions:
            - kind: SendActivity
              id: sendMessage_req023
              activity: |-
                Pull request opened: {Topic.SubmitResult.pullRequestUrl}

                Branch: `{Topic.SubmitResult.branch}` (pull request #{Topic.SubmitResult.pullRequestNumber}).

                The repository's `validate.yml` workflow runs the rules
                engine on your manifest. Watch the pull request checks, fix
                any blocking findings, then ask a governance reviewer to
                approve. On merge, `provision.yml` creates the workspace in
                Fabric.

      elseActions:
        - kind: SendActivity
          id: sendMessage_req024
          activity: |-
            Submission failed.

            Error: {Topic.SubmitResult.error}

            Please retry, or open the pull request yourself: copy
            `workspaces/dev-plt-sample-hello.yaml` to
            `workspaces/{Topic.Name}.yaml`, edit the values and open a pull
            request against `main`.
