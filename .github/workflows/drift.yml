name: drift

# ── Blueprint reference workflow — dormant in the canonical public repo ──────────────
# Scheduled drift detection on a customer-provided [self-hosted, fabric-gov] runner via
# Azure OIDC. The canonical public repo has no such runner, so this workflow is DISABLED
# in repo settings (Actions tab) to avoid a daily run that queues forever.
# To use in a real delivery: fork/clone, register the runner + set the required repo
# variables (Azure OIDC client/tenant, Fabric capacity), then Actions → drift → "Enable".
# ─────────────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '17 3 * * *'   # daily 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  drift:
    runs-on: [self-hosted, fabric-gov]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet -r scripts/requirements.txt
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Detect drift
        id: drift
        run: |
          set +e
          python scripts/drift.py
          echo "rc=$?" >> $GITHUB_OUTPUT

      - name: Open issue on drift
        if: steps.drift.outputs.rc != '0'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Fabric workspace drift detected"
          content-filepath: drift-report.md
          labels: drift, governance
